name            = "aibrokeragent-gateway"
main            = "gateway.js"
compatibility_date = "2026-05-21"

# ── Go-live steps ──────────────────────────────────────────────────────────────
#
# 1. Create KV namespaces and paste the returned IDs below:
#       wrangler kv namespace create ROACH_MOTEL
#       wrangler kv namespace create API_KEYS
#
# 2. Set secrets (never stored in this file):
#       wrangler secret put ORIGIN_URL
#       wrangler secret put CF_API_TOKEN    # Zone:Firewall:Edit permission
#       wrangler secret put CF_ZONE_ID
#       wrangler secret put ALERT_WEBHOOK           # optional — Formspree endpoint for alerts
#       wrangler secret put ABUSEIPDB_KEY           # optional — Blinky threat intel (abuseipdb.com free tier)
#       wrangler secret put STRIPE_WEBHOOK_SECRET   # Phase 3 — from Stripe dashboard → Webhooks
#       wrangler secret put STRIPE_PRO_CHECKOUT_URL # Phase 3 — Stripe Payment Link URL for Pro tier
#
# 3. Deploy:
#       wrangler deploy
#
# 4. In Cloudflare dashboard → Workers → aibrokeragent-gateway → Routes:
#    Add route: api.ai-broker-agent.com/* → this Worker
#
# ──────────────────────────────────────────────────────────────────────────────

[[kv_namespaces]]
binding = "ROACH_MOTEL"
id      = "0117e69a5f7c43a1b9b94a5613383324"

[[kv_namespaces]]
binding = "API_KEYS"
id      = "5f4e64e9788642cb92b7cf428cd10815"

[dev]
port = 8787

# Local dev: create a .dev.vars file (git-ignored) with:
#   ORIGIN_URL=http://localhost:3000
