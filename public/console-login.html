<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIbrokerAGEnt — Console Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 0 1.5rem;
    }
    .logo {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
    }
    .tagline {
      text-align: center;
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 2.5rem;
    }
    .card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 2rem;
    }
    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #e0e0e0;
    }
    .field {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: #6ee7b7;
    }
    button[type="submit"] {
      width: 100%;
      background: #6ee7b7;
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.8rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.15s;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      color: #f87171;
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      margin-top: 1rem;
      display: none;
    }
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #1e1e1e;
    }
    .tab-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 0.9rem;
      padding: 0.5rem 1rem 0.75rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab-btn.active {
      color: #6ee7b7;
      border-bottom-color: #6ee7b7;
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span style="color:#6ee7b7">AI</span><span style="color:#60a5fa">broker</span><span style="color:#6ee7b7">AGE</span><span style="color:#60a5fa">nt</span>
    </div>
    <div class="tagline">Human Trust Console</div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Sign In</button>
        <button class="tab-btn" data-tab="register">Accept Invite</button>
      </div>

      <!-- Login -->
      <div class="tab-pane active" id="tab-login">
        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" autocomplete="email" required placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••" />
          </div>
          <button type="submit" id="login-btn">Sign In</button>
          <div class="error-msg" id="login-error"></div>
        </form>
      </div>

      <!-- Register via invite -->
      <div class="tab-pane" id="tab-register">
        <form id="register-form">
          <div class="field">
            <label for="reg-token">Invite Token</label>
            <input type="text" id="reg-token" required placeholder="Paste your invite token" />
          </div>
          <div class="field">
            <label for="reg-name">Your Name</label>
            <input type="text" id="reg-name" required placeholder="Alice Smith" />
          </div>
          <div class="field">
            <label for="reg-password">Choose Password</label>
            <input type="password" id="reg-password" required placeholder="Min. 8 characters" minlength="8" />
          </div>
          <button type="submit" id="register-btn">Create Account</button>
          <div class="error-msg" id="register-error"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // Pre-fill invite token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const inviteToken = urlParams.get('invite');
    if (inviteToken) {
      document.getElementById('reg-token').value = inviteToken;
      document.querySelector('[data-tab="register"]').click();
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError(id) {
      document.getElementById(id).style.display = 'none';
    }

    function storeSessionAndRedirect(data) {
      localStorage.setItem('console_session_token', data.session_token);
      localStorage.setItem('console_user_id', data.user_id);
      if (data.platform_role) {
        localStorage.setItem('console_platform_role', data.platform_role);
      }
      if (data.agent_access && data.agent_access.length > 0) {
        localStorage.setItem('console_agent_id', data.agent_access[0].agent_id);
      }
      // Watchers go to the overview; owners/employees go to the full dashboard
      if (data.platform_role === 'watcher') {
        window.location.href = '/console-overview.html';
      } else {
        window.location.href = '/console-dashboard.html';
      }
    }

    // Login
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      hideError('login-error');
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const resp = await fetch('/console/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value,
          }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Login failed');
        storeSessionAndRedirect(data);
      } catch (err) {
        showError('login-error', err.message);
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Register
    document.getElementById('register-form').addEventListener('submit', async e => {
      e.preventDefault();
      hideError('register-error');
      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      try {
        const resp = await fetch('/console/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: document.getElementById('reg-token').value.trim(),
            name: document.getElementById('reg-name').value.trim(),
            password: document.getElementById('reg-password').value,
          }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Registration failed');
        storeSessionAndRedirect(data);
      } catch (err) {
        showError('register-error', err.message);
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
